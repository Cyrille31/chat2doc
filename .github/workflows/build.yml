# Chat2Doc — construction automatique de l'application Android
# À chaque envoi sur GitHub : tests, puis APK téléchargeable dans l'onglet « Actions ».
# À chaque étiquette « v1.0 », « v1.1 »... : l'APK est joint à une « Release » publique.
name: Construction de l'APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (si elle est configurée dans les secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.CHAT2DOC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chat2doc.jks"
            echo "CHAT2DOC_KEYSTORE=$RUNNER_TEMP/chat2doc.jks" >> "$GITHUB_ENV"
            echo "Clé de signature trouvée : la version « release » sera signée."
          else
            echo "Pas de clé de signature : seule la version « debug » sera produite."
          fi

      - name: Tests du moteur de conversion
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Construction (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Construction (release signée)
        if: env.CHAT2DOC_KEYSTORE != ''
        env:
          CHAT2DOC_KEYSTORE_PASSWORD: ${{ secrets.CHAT2DOC_KEYSTORE_PASSWORD }}
          CHAT2DOC_KEY_ALIAS: ${{ secrets.CHAT2DOC_KEY_ALIAS }}
          CHAT2DOC_KEY_PASSWORD: ${{ secrets.CHAT2DOC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Chat2Doc-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
