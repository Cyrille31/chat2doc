plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.cgexcel.chat2doc'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.cgexcel.chat2doc'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Signature des versions publiées : clé fournie par des variables d'environnement
    // (secrets GitHub dans le workflow). Sans elles, seule la version « debug » est signée.
    signingConfigs {
        // Clé « debug » commune, versionnée dans le dépôt : les APK de test construits par GitHub
        // peuvent ainsi s'installer les uns par-dessus les autres. Elle ne protège rien : ne pas
        // l'utiliser pour une publication sur le Play Store.
        debug {
            storeFile file('chat2doc-debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ks = System.getenv('CHAT2DOC_KEYSTORE')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('CHAT2DOC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHAT2DOC_KEY_ALIAS')
                keyPassword System.getenv('CHAT2DOC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('CHAT2DOC_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "Chat2Doc-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
